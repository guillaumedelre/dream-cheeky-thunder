[project]
name = "dream-cheeky-thunder"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "pyusb>=1.2.1",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thunder"]
