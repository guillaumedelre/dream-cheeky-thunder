<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>THUNDER CONTROL</title>
  <style>
    :root {
      --bg:       #050300;
      --surface:  #0b0800;
      --panel:    #0f0b00;
      --brdr:     #221500;
      --brdr-hi:  #4a3000;
      --txt:      #c87e00;
      --txt-hi:   #ffcc40;
      --txt-dim:  #362200;
      --txt-mute: #5a3e00;
      --amber:    #ffaa00;
      --green:    #38e060;
      --red:      #ff2800;
      --red-hi:   #ff5530;
      --red-dim:  #1f0400;
      --glow:        0 0 10px rgba(255,160,0,.35), 0 0 24px rgba(255,160,0,.12);
      --glow-red:    0 0 10px rgba(255,40,0,.5),   0 0 24px rgba(255,40,0,.15);
      --glow-green:  0 0  8px rgba(56,224,96,.4),  0 0 20px rgba(56,224,96,.12);
    }

    /* ── Animations ── */
    @keyframes scan-move {
      from { transform: translateY(-80px); }
      to   { transform: translateY(100vh); }
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.1} }
    @keyframes boot {
      0%   { opacity:0; transform:scaleY(.04) }
      25%  { opacity:1; transform:scaleY(.04) }
      55%  { transform:scaleY(1) }
      100% { transform:scaleY(1) }
    }
    @keyframes spin-slow {
      from { transform:rotate(0deg) } to { transform:rotate(360deg) }
    }
    @keyframes spin-rev {
      from { transform:rotate(0deg) } to { transform:rotate(-360deg) }
    }
    @keyframes fire-pulse {
      0%,100% { box-shadow: var(--glow-red), inset 0 0 18px rgba(255,40,0,.08) }
      50%     { box-shadow: 0 0 22px rgba(255,40,0,.65), 0 0 50px rgba(255,40,0,.2), inset 0 0 28px rgba(255,40,0,.15) }
    }

    * { box-sizing:border-box; margin:0; padding:0 }

    body {
      background:
        radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%),
        linear-gradient(rgba(255,150,0,.035) 1px, transparent 1px) center / 36px 36px,
        linear-gradient(90deg, rgba(255,150,0,.035) 1px, transparent 1px) center / 36px 36px,
        var(--bg);
      color: var(--txt);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1rem;
      gap: .75rem;
      animation: boot .7s cubic-bezier(.2,0,.3,1) both;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    /* scanline overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent 0 3px, rgba(0,0,0,.18) 3px 4px
      );
      pointer-events: none;
      z-index: 9000;
    }

    /* sweep */
    body::after {
      content: '';
      position: fixed; left:0; right:0;
      height: 80px;
      background: linear-gradient(transparent, rgba(255,150,0,.04), transparent);
      animation: scan-move 8s linear infinite;
      pointer-events: none;
      z-index: 9001;
    }

    /* ── Header ── */
    .hdr {
      width: 100%; max-width: 380px;
      text-align: center;
      padding: .2rem 0 .1rem;
    }
    .hdr-bar {
      display: flex; align-items: center; gap: .6rem;
      margin-bottom: .25rem;
    }
    .hdr-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--brdr-hi));
    }
    .hdr-line:last-child {
      background: linear-gradient(to left, transparent, var(--brdr-hi));
    }
    h1 {
      font-size: .82rem; font-weight: normal;
      letter-spacing: .4em;
      color: var(--txt-hi);
      text-shadow: var(--glow);
    }
    .hdr-sub {
      font-size: .55rem; letter-spacing: .18em;
      color: var(--txt-dim);
    }

    /* ── Panel shell ── */
    .panel {
      position: relative;
      background: var(--panel);
      border: 1px solid var(--brdr);
      width: 100%; max-width: 380px;
    }
    /* top-left bracket */
    .panel::before {
      content: '';
      position: absolute; top:-2px; left:-2px;
      width:14px; height:14px;
      border-top: 2px solid var(--txt);
      border-left: 2px solid var(--txt);
    }
    /* bottom-right bracket */
    .panel::after {
      content: '';
      position: absolute; bottom:-2px; right:-2px;
      width:14px; height:14px;
      border-bottom: 2px solid var(--txt);
      border-right: 2px solid var(--txt);
    }
    .p-tag {
      position: absolute; top:-.6rem; left:.9rem;
      background: var(--bg);
      padding: 0 .35rem;
      font-size: .55rem; letter-spacing: .2em;
      color: var(--txt-mute);
    }

    /* ── Status ── */
    .status-row {
      display: grid;
      grid-template-columns: auto 1fr 1fr 1fr;
      align-items: center;
      gap: .4rem .8rem;
      padding: .7rem .8rem;
    }
    .dot-cell { display:flex; align-items:center; }
    .dot {
      width:9px; height:9px; border-radius:50%;
      background: var(--red);
      box-shadow: var(--glow-red);
      animation: blink 1.3s ease-in-out infinite;
      transition: background .4s, box-shadow .4s;
    }
    .dot.connected {
      background: var(--green);
      box-shadow: var(--glow-green);
      animation: none;
    }
    .sf { display:flex; flex-direction:column; gap:.1rem; }
    .sf-l {
      font-size:.52rem; letter-spacing:.12em;
      color: var(--txt-dim);
    }
    .sf-v {
      font-size:.78rem;
      color: var(--txt-hi);
      text-shadow: var(--glow);
    }

    /* ── Targeting / D-pad ── */
    .target-body {
      display: flex; justify-content: center;
      padding: .9rem .8rem;
    }
    .reticle {
      position: relative;
      width: 228px; height: 228px;
    }

    /* rings */
    .r-ring-outer {
      position:absolute; inset:0;
      border-radius:50%;
      border:1px solid var(--brdr-hi);
      box-shadow: inset 0 0 30px rgba(255,150,0,.04);
    }
    .r-ring-mid {
      position:absolute; inset:14px;
      border-radius:50%;
      border:1px dashed var(--brdr);
    }
    .r-spin-1 {
      position:absolute; inset:26px;
      border-radius:50%;
      border: 1px solid transparent;
      border-top-color: var(--txt-mute);
      border-right-color: var(--txt-mute);
      animation: spin-slow 14s linear infinite;
    }
    .r-spin-2 {
      position:absolute; inset:38px;
      border-radius:50%;
      border: 1px solid transparent;
      border-bottom-color: var(--brdr-hi);
      animation: spin-rev 20s linear infinite;
    }

    /* crosshair lines */
    .r-h, .r-v { position:absolute; background:var(--brdr-hi); }
    .r-h { left:16px; right:16px; height:1px; top:50%; transform:translateY(-50%); }
    .r-v { top:16px; bottom:16px; width:1px; left:50%; transform:translateX(-50%); }

    /* corner ticks */
    .r-deg {
      position:absolute;
      font-size:.46rem; letter-spacing:0;
      color: var(--txt-dim);
    }
    .r-deg-n { top:28px; left:50%; transform:translateX(-50%); }
    .r-deg-s { bottom:28px; left:50%; transform:translateX(-50%); }
    .r-deg-e { right:28px; top:50%; transform:translateY(-50%); }
    .r-deg-w { left:28px; top:50%; transform:translateY(-50%); }

    /* center diamond */
    .r-ctr {
      position:absolute;
      width:10px; height:10px;
      background: var(--amber);
      box-shadow: var(--glow);
      top:50%; left:50%;
      transform:translate(-50%,-50%) rotate(45deg);
    }

    /* D-pad buttons */
    .dpad-btn {
      position:absolute;
      width:52px; height:52px;
      background: var(--surface);
      border:1px solid var(--brdr-hi);
      color: var(--txt);
      font-size:.9rem;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      user-select:none; -webkit-user-select:none;
      touch-action:none;
      transition: background .1s, color .1s, border-color .1s;
    }
    .dpad-btn:hover {
      background: rgba(255,160,0,.07);
      border-color: var(--txt);
    }
    .dpad-btn.active {
      background: rgba(255,160,0,.2);
      border-color: var(--amber);
      color: var(--amber);
      filter: drop-shadow(0 0 6px rgba(255,160,0,.5));
    }
    [data-dir="up"]    { top:6px;    left:50%; transform:translateX(-50%); }
    [data-dir="down"]  { bottom:6px; left:50%; transform:translateX(-50%); }
    [data-dir="left"]  { left:6px;   top:50%;  transform:translateY(-50%); }
    [data-dir="right"] { right:6px;  top:50%;  transform:translateY(-50%); }

    /* ── Angle gauges ── */
    .gauges-body {
      display:flex; flex-direction:column;
      gap:.75rem;
      padding:.85rem .8rem;
    }
    .g-row {
      display:flex; align-items:center; gap:.6rem;
    }
    .g-lbl {
      font-size:.55rem; letter-spacing:.14em;
      color: var(--txt-dim);
      width:38px; flex-shrink:0;
    }
    .g-track { flex:1; position:relative; }

    input[type="range"] {
      -webkit-appearance:none; appearance:none;
      width:100%; height:3px;
      background: var(--brdr-hi);
      outline:none; cursor:pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance:none;
      width:13px; height:22px;
      background: var(--amber);
      box-shadow: 0 0 8px rgba(255,160,0,.6);
      cursor:pointer;
      clip-path: polygon(50% 0%,100% 28%,100% 72%,50% 100%,0% 72%,0% 28%);
    }
    input[type="range"]::-moz-range-thumb {
      width:13px; height:22px;
      background: var(--amber);
      border:none; cursor:pointer;
    }
    input[type="range"]:focus { outline:none; }

    /* colored track fill via background gradient — approximated via JS on input */
    .g-val {
      font-size:.78rem;
      width:44px; text-align:right; flex-shrink:0;
      color: var(--txt-hi);
      text-shadow: var(--glow);
    }

    /* ── Secondary controls ── */
    .ctrl-body {
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:.5rem;
      padding:.75rem .8rem;
    }
    .btn {
      padding:.55rem .3rem;
      border:1px solid var(--brdr-hi);
      background: var(--surface);
      color: var(--txt);
      font-family:inherit;
      font-size:.62rem; letter-spacing:.12em;
      text-transform:uppercase;
      cursor:pointer;
      transition: background .1s, border-color .1s;
    }
    .btn:hover  { border-color:var(--txt); background:rgba(255,160,0,.07); }
    .btn:active { background:rgba(255,160,0,.15); }
    #led-btn.on {
      color: var(--amber); border-color:var(--amber);
      background: rgba(255,160,0,.1);
      filter: drop-shadow(0 0 5px rgba(255,160,0,.4));
    }

    /* ── Fire ── */
    .fire-body { padding:.75rem .8rem; }
    #fire-btn {
      width:100%; padding:1rem;
      background: var(--red-dim);
      border:1px solid var(--red);
      color: var(--red-hi);
      font-family:inherit;
      font-size:.95rem; letter-spacing:.35em;
      text-transform:uppercase;
      cursor:pointer;
      animation: fire-pulse 2.2s ease-in-out infinite;
      transition: background .1s, letter-spacing .08s;
      text-shadow: 0 0 10px rgba(255,80,40,.5);
    }
    #fire-btn:hover {
      background: rgba(255,40,0,.2);
      letter-spacing:.5em;
      animation: none;
      box-shadow: 0 0 24px rgba(255,40,0,.45), inset 0 0 30px rgba(255,40,0,.12);
    }
    #fire-btn:active {
      background: rgba(255,40,0,.35);
      transform: scale(.99);
      animation: none;
    }

    /* ── Divider between sections ── */
    .sect-div {
      width:100%; max-width:380px;
      display:flex; align-items:center; gap:.5rem;
    }
    .sect-div::before, .sect-div::after {
      content:''; flex:1; height:1px;
      background: var(--brdr);
    }
    .sect-div-txt {
      font-size:.5rem; letter-spacing:.2em;
      color: var(--txt-dim);
    }

    /* ── Toast ── */
    #toast {
      position:fixed; bottom:1.5rem; left:50%;
      transform:translateX(-50%);
      background:var(--red-dim); border:1px solid var(--red);
      padding:.35rem .8rem;
      font-size:.7rem; letter-spacing:.1em;
      color:var(--red-hi);
      opacity:0; transition:opacity .2s;
      pointer-events:none; white-space:nowrap;
      z-index:9999;
      text-shadow: var(--glow-red);
    }
    #toast.show { opacity:1; }

    /* ── Busy state (park / fire in progress) ── */
    .btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      border-color: var(--brdr);
      color: var(--txt-dim);
    }
    #fire-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
      animation: none;
      letter-spacing: .35em;
    }
  </style>
</head>
<body>

<div class="hdr">
  <div class="hdr-bar">
    <div class="hdr-line"></div>
    <h1>THUNDER CONTROL</h1>
    <div class="hdr-line"></div>
  </div>
  <div class="hdr-sub">DREAM CHEEKY MK.I &nbsp;//&nbsp; TARGETING SYSTEM v1.0</div>
</div>

<!-- System status -->
<div class="panel">
  <span class="p-tag">SYS STATUS</span>
  <div class="status-row">
    <div class="dot-cell"><div class="dot" id="dot"></div></div>
    <div class="sf">
      <span class="sf-l">AMMO</span>
      <span class="sf-v" id="s-missiles">-</span>
    </div>
    <div class="sf">
      <span class="sf-l">YAW</span>
      <span class="sf-v" id="s-yaw">-</span>
    </div>
    <div class="sf">
      <span class="sf-l">PITCH</span>
      <span class="sf-v" id="s-pitch">-</span>
    </div>
  </div>
</div>

<!-- Targeting reticle / D-pad -->
<div class="panel">
  <span class="p-tag">TARGETING</span>
  <div class="target-body">
    <div class="reticle">
      <div class="r-ring-outer"></div>
      <div class="r-ring-mid"></div>
      <div class="r-spin-1"></div>
      <div class="r-spin-2"></div>
      <div class="r-h"></div>
      <div class="r-v"></div>
      <span class="r-deg r-deg-n">000</span>
      <span class="r-deg r-deg-e">090</span>
      <span class="r-deg r-deg-s">180</span>
      <span class="r-deg r-deg-w">270</span>
      <div class="r-ctr"></div>
      <button class="dpad-btn" data-dir="up">▲</button>
      <button class="dpad-btn" data-dir="left">◀</button>
      <button class="dpad-btn" data-dir="right">▶</button>
      <button class="dpad-btn" data-dir="down">▼</button>
    </div>
  </div>
</div>

<!-- Angle gauges -->
<div class="panel">
  <span class="p-tag">ANGLES</span>
  <div class="gauges-body">
    <div class="g-row">
      <span class="g-lbl">YAW</span>
      <div class="g-track">
        <input type="range" id="yaw-slider" min="-135" max="135" value="0">
      </div>
      <span class="g-val" id="yaw-val">0°</span>
    </div>
    <div class="g-row">
      <span class="g-lbl">PITCH</span>
      <div class="g-track">
        <input type="range" id="pitch-slider" min="-5" max="45" value="0">
      </div>
      <span class="g-val" id="pitch-val">0°</span>
    </div>
  </div>
</div>

<!-- Secondary controls -->
<div class="panel">
  <span class="p-tag">CONTROLS</span>
  <div class="ctrl-body">
    <button class="btn" id="park-btn">⌂ PARK</button>
    <button class="btn" id="reload-btn">↺ RELOAD</button>
    <button class="btn" id="led-btn">◉ LED</button>
  </div>
</div>

<!-- Fire -->
<div class="panel">
  <span class="p-tag">WEAPONS</span>
  <div class="fire-body">
    <button id="fire-btn">⚡ FIRE ⚡</button>
  </div>
</div>

<div id="toast"></div>

<script>
  let ledOn = false;

  const dot         = document.getElementById('dot');
  const sMissiles   = document.getElementById('s-missiles');
  const sYaw        = document.getElementById('s-yaw');
  const sPitch      = document.getElementById('s-pitch');
  const yawSlider   = document.getElementById('yaw-slider');
  const yawVal      = document.getElementById('yaw-val');
  const pitchSlider = document.getElementById('pitch-slider');
  const pitchVal    = document.getElementById('pitch-val');
  const ledBtn      = document.getElementById('led-btn');
  const toast       = document.getElementById('toast');

  function updateSliderTrack(slider) {
    const min = +slider.min, max = +slider.max, val = +slider.value;
    const pct = ((val - min) / (max - min)) * 100;
    slider.style.background = `linear-gradient(to right, #ffaa00 ${pct}%, #4a3000 ${pct}%)`;
  }
  updateSliderTrack(yawSlider);
  updateSliderTrack(pitchSlider);

  async function api(method, path, params = {}, busyEl = null) {
    if (busyEl) busyEl.disabled = true;
    const url = new URL(path, location.href);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    try {
      const res = await fetch(url, { method });
      const data = await res.json();
      if (!res.ok) showToast(data.detail ?? 'Error');
      else applyState(data);
    } catch {
      showToast('Connection error');
    } finally {
      if (busyEl) busyEl.disabled = false;
    }
  }

  function applyState(s) {
    dot.className = 'dot' + (s.connected ? ' connected' : '');
    sMissiles.textContent = s.missiles;
    sYaw.textContent      = s.yaw + '°';
    sPitch.textContent    = s.pitch + '°';
    yawSlider.value       = s.yaw;   yawVal.textContent   = s.yaw + '°';
    pitchSlider.value     = s.pitch; pitchVal.textContent = s.pitch + '°';
    updateSliderTrack(yawSlider);
    updateSliderTrack(pitchSlider);
    ledOn = s.led;
    ledBtn.classList.toggle('on', ledOn);
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  async function poll() {
    try {
      const res = await fetch('/status');
      if (res.ok) applyState(await res.json());
    } catch {}
  }
  poll();
  setInterval(poll, 3000);

  let moveTimer = null;
  let activeDir = null;

  function startMove(dir) {
    if (activeDir === dir) return;
    stopMove();
    activeDir = dir;
    document.querySelector(`[data-dir="${dir}"]`)?.classList.add('active');
    const send = () => api('POST', `/move/${dir}`, { duration: 500 });
    send();
    moveTimer = setInterval(send, 600);
  }

  function stopMove() {
    if (!activeDir) return;
    clearInterval(moveTimer);
    moveTimer = null;
    document.querySelector(`[data-dir="${activeDir}"]`)?.classList.remove('active');
    activeDir = null;
  }

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('mousedown',  () => startMove(dir));
    btn.addEventListener('touchstart', e => { e.preventDefault(); startMove(dir); }, { passive: false });
  });

  document.addEventListener('mouseup',  stopMove);
  document.addEventListener('touchend', stopMove);

  yawSlider.addEventListener('input', () => {
    yawVal.textContent = yawSlider.value + '°';
    updateSliderTrack(yawSlider);
    clearTimeout(yawSlider._t);
    yawSlider._t = setTimeout(() => api('POST', `/yaw/${yawSlider.value}`), 300);
  });

  pitchSlider.addEventListener('input', () => {
    pitchVal.textContent = pitchSlider.value + '°';
    updateSliderTrack(pitchSlider);
    clearTimeout(pitchSlider._t);
    pitchSlider._t = setTimeout(() => api('POST', `/pitch/${pitchSlider.value}`), 300);
  });

  document.getElementById('fire-btn').addEventListener('click',   e => api('POST', '/fire', {}, e.currentTarget));
  document.getElementById('park-btn').addEventListener('click',   e => api('POST', '/park', {}, e.currentTarget));
  document.getElementById('reload-btn').addEventListener('click', () => api('POST', '/reload'));
  ledBtn.addEventListener('click', () => {
    ledOn = !ledOn;
    api('POST', '/led', { on: ledOn });
    ledBtn.classList.toggle('on', ledOn);
  });
</script>
</body>
</html>
