<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thunder Control</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #7d8590;
      --accent: #f78166;
      --accent-dim: #3d1f1a;
      --green: #3fb950;
      --red: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      gap: 1.5rem;
    }

    h1 {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* Status bar */
    #status {
      display: flex;
      gap: 1.25rem;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.65rem 1.1rem;
      font-size: 0.82rem;
      width: 100%;
      max-width: 360px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
      transition: background 0.3s;
    }
    .dot.connected { background: var(--green); }

    .status-item { color: var(--muted); }
    .status-item span { color: var(--text); font-weight: 500; }

    /* D-pad */
    #dpad {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      gap: 6px;
    }

    .dpad-btn {
      width: 68px;
      height: 68px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      transition: background 0.1s, border-color 0.1s;
    }

    .dpad-btn.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    [data-dir="up"]    { grid-area: up; }
    [data-dir="left"]  { grid-area: left; }
    [data-dir="right"] { grid-area: right; }
    [data-dir="down"]  { grid-area: down; }

    /* Sliders */
    #sliders {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .slider-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      width: 36px;
      flex-shrink: 0;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 4px;
    }

    .slider-value {
      font-size: 0.82rem;
      font-weight: 500;
      width: 40px;
      text-align: right;
      flex-shrink: 0;
    }

    /* Action buttons */
    #actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      width: 100%;
      max-width: 360px;
    }

    .btn {
      padding: 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s;
    }

    .btn:hover  { border-color: var(--muted); }
    .btn:active { background: #21262d; }

    #fire-btn {
      grid-column: 1 / -1;
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
      font-size: 0.95rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.9rem;
    }
    #fire-btn:hover  { background: #5a2a24; }
    #fire-btn:active { background: #7a3a34; }

    #led-btn.on { color: #f0c060; border-color: #f0c060; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: #21262d;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.45rem 0.9rem;
      font-size: 0.8rem;
      color: var(--red);
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<h1>Thunder Control</h1>

<div id="status">
  <div class="dot" id="dot"></div>
  <div class="status-item">Missiles: <span id="s-missiles">-</span></div>
  <div class="status-item">Yaw: <span id="s-yaw">-</span></div>
  <div class="status-item">Pitch: <span id="s-pitch">-</span></div>
</div>

<div id="dpad">
  <button class="dpad-btn" data-dir="up">▲</button>
  <button class="dpad-btn" data-dir="left">◀</button>
  <button class="dpad-btn" data-dir="right">▶</button>
  <button class="dpad-btn" data-dir="down">▼</button>
</div>

<div id="sliders">
  <div class="slider-row">
    <span class="slider-label">Yaw</span>
    <input type="range" id="yaw-slider" min="-135" max="135" value="0">
    <span class="slider-value" id="yaw-val">0°</span>
  </div>
  <div class="slider-row">
    <span class="slider-label">Pitch</span>
    <input type="range" id="pitch-slider" min="-5" max="45" value="0">
    <span class="slider-value" id="pitch-val">0°</span>
  </div>
</div>

<div id="actions">
  <button class="btn" id="fire-btn">🚀 FIRE</button>
  <button class="btn" id="park-btn">⌂ Park</button>
  <button class="btn" id="reload-btn">↺ Reload</button>
  <button class="btn" id="led-btn">● LED</button>
</div>

<div id="toast"></div>

<script>
  // State
  let ledOn = false;

  // DOM refs
  const dot       = document.getElementById('dot');
  const sMissiles = document.getElementById('s-missiles');
  const sYaw      = document.getElementById('s-yaw');
  const sPitch    = document.getElementById('s-pitch');
  const yawSlider = document.getElementById('yaw-slider');
  const yawVal    = document.getElementById('yaw-val');
  const pitchSlider = document.getElementById('pitch-slider');
  const pitchVal  = document.getElementById('pitch-val');
  const ledBtn    = document.getElementById('led-btn');
  const toast     = document.getElementById('toast');

  // API helper
  async function api(method, path, params = {}) {
    const url = new URL(path, location.href);
    Object.entries(params).forEach(([k, v]) => url.searchParams.set(k, v));
    try {
      const res = await fetch(url, { method });
      const data = await res.json();
      if (!res.ok) showToast(data.detail ?? 'Error');
      else applyState(data);
    } catch {
      showToast('Connection error');
    }
  }

  function applyState(s) {
    dot.className = 'dot' + (s.connected ? ' connected' : '');
    sMissiles.textContent = s.missiles;
    sYaw.textContent   = s.yaw + '°';
    sPitch.textContent = s.pitch + '°';
    yawSlider.value  = s.yaw;   yawVal.textContent   = s.yaw + '°';
    pitchSlider.value = s.pitch; pitchVal.textContent = s.pitch + '°';
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 3000);
  }

  // Status polling
  async function poll() {
    try {
      const res = await fetch('/status');
      if (res.ok) applyState(await res.json());
    } catch { /* server unreachable */ }
  }
  poll();
  setInterval(poll, 3000);

  // D-pad: hold to repeat moves
  let moveTimer = null;
  let activeDir = null;

  function startMove(dir) {
    if (activeDir === dir) return;
    stopMove();
    activeDir = dir;
    document.querySelector(`[data-dir="${dir}"]`)?.classList.add('active');
    const send = () => api('POST', `/move/${dir}`, { duration: 500 });
    send();
    moveTimer = setInterval(send, 600);
  }

  function stopMove() {
    if (!activeDir) return;
    clearInterval(moveTimer);
    moveTimer = null;
    document.querySelector(`[data-dir="${activeDir}"]`)?.classList.remove('active');
    activeDir = null;
  }

  document.querySelectorAll('.dpad-btn').forEach(btn => {
    const dir = btn.dataset.dir;
    btn.addEventListener('mousedown',  () => startMove(dir));
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); startMove(dir); }, { passive: false });
  });

  document.addEventListener('mouseup',  stopMove);
  document.addEventListener('touchend', stopMove);

  // Yaw/pitch sliders: debounce to avoid flooding the API while dragging
  let yawTimer = null;
  yawSlider.addEventListener('input', () => {
    yawVal.textContent = yawSlider.value + '°';
    clearTimeout(yawTimer);
    yawTimer = setTimeout(() => api('POST', `/yaw/${yawSlider.value}`), 300);
  });

  let pitchTimer = null;
  pitchSlider.addEventListener('input', () => {
    pitchVal.textContent = pitchSlider.value + '°';
    clearTimeout(pitchTimer);
    pitchTimer = setTimeout(() => api('POST', `/pitch/${pitchSlider.value}`), 300);
  });

  // Action buttons
  document.getElementById('fire-btn').addEventListener('click', () => api('POST', '/fire'));
  document.getElementById('park-btn').addEventListener('click', () => api('POST', '/park'));
  document.getElementById('reload-btn').addEventListener('click', () => api('POST', '/reload'));

  ledBtn.addEventListener('click', () => {
    ledOn = !ledOn;
    api('POST', '/led', { on: ledOn });
    ledBtn.classList.toggle('on', ledOn);
  });
</script>

</body>
</html>
